name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright test
      # Bricht ab, solange offene Fragen (TODO(sebastian)) oder Impressum-Platzhalter vorhanden sind.
      - run: npm run release:check
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Erst nach dem Livegang (Repo-Variable LIVE=true), vorher hängt keine Domain am Worker.
      - if: vars.LIVE == 'true'
        run: scripts/smoke.sh https://sifa-web.com --prod
