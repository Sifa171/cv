summary:
  de: Homeserver mit Proxmox und eigenen VMs für Passwortmanager (Vaultwarden), Dokumentenarchiv (Paperless-ngx) und DNS (AdGuard Home) – automatisiert mit Ansible, verschlüsselte Backups in die Cloud und zu einem Freund.
